plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

// Keep generated build/runtime files out of synchronized directories when requested.
if (project.hasProperty("flycraftBuildDir")) {
	layout.buildDirectory = file(project.property("flycraftBuildDir"))
}

loom {
	splitEnvironmentSourceSets()
	if (project.hasProperty("flycraftRunDir")) {
		runs.configureEach {
			runDir = project.property("flycraftRunDir").toString()
		}
	}

	if (project.hasProperty("flycraftAutotest")) {
		runs.client {
			programArguments.add("--quickPlayMultiplayer")
			programArguments.add(project.findProperty("flycraftServer") ?: "localhost:25565")
			if (project.hasProperty("flycraftGraphicsBackend")) {
				programArguments.add("--graphicsBackend")
				programArguments.add(project.property("flycraftGraphicsBackend").toString())
			}
			jvmArguments.add("-Xmx" + (project.findProperty("flycraftClientHeapMiB") ?: "1536") + "m")
			if(project.hasProperty("flycraftCaptureWidth")) {
				programArguments.addAll(["--width",project.property("flycraftCaptureWidth").toString(),
					"--height",project.property("flycraftCaptureHeight").toString()])
			}
		}
	}
	if(project.hasProperty("flycraftServerHeapMiB")) {
		runs.server { jvmArguments.add("-Xmx" + project.property("flycraftServerHeapMiB") + "m") }
	}

	mods {
		"flycraft_bridge" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// Prepare Loom's exact launch arguments, then exit Gradle before running a
// server/client. This avoids retaining a Gradle JVM for each live environment.
if (project.hasProperty("flycraftExportLaunchDir")) {
	tasks.withType(JavaExec).configureEach { runTask ->
		if (runTask.name in ["runServer", "runClient"]) {
			if(runTask.name == "runServer") runTask.mustRunAfter("downloadAssets")
			runTask.doFirst {
				def destination = new File(project.property("flycraftExportLaunchDir").toString(), runTask.name + ".json")
				if (destination.exists()) throw new GradleException("Refusing to overwrite exported launch: " + destination)
				destination.parentFile.mkdirs()
				def arguments = new ArrayList()
				runTask.getAllJvmArgs().each { argument ->
					if(argument.startsWith("@")) {
						def contents = file(argument.substring(1)).getText("UTF-8")
						def lines = contents.readLines()
						if(lines.size() != 2 || !(lines[0] in ["-classpath", "-cp"]))
							throw new GradleException("Unsupported nested JVM argument file")
						// Its full classpath is added below. Java does not expand
						// nested @files in our outer launch argument file.
					} else arguments.add(argument)
				}
				if (!runTask.classpath.empty) arguments.addAll(["-cp", runTask.classpath.asPath])
				arguments.add(runTask.mainClass.get())
				arguments.addAll(runTask.args)
				runTask.argumentProviders.each { arguments.addAll(it.asArguments()) }
				def value = [schema: 1, task: runTask.name,
					executable: runTask.javaLauncher.get().executablePath.asFile.absolutePath,
					arguments: arguments, workingDirectory: runTask.workingDir.absolutePath]
				destination.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(value)), "UTF-8")
				throw new org.gradle.api.tasks.StopExecutionException("Launch exported; no game process started")
			}
		}
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
